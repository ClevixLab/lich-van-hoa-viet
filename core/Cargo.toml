[package]
name = "lvhv-core"
version = "0.1.0"
edition = "2021"
description = "Lõi lịch âm Việt Nam (Lịch và Văn hóa Việt) — không phụ thuộc thư viện ngoài"
# Chưa chọn giấy phép mã nguồn mở — xem LICENSE ở gốc kho và docs/05 (câu hỏi mở).
license-file = "../LICENSE"
publish = false

[lib]
name = "lvhv_core"
path = "src/lib.rs"

[[bin]]
name = "lvhv-dump"
path = "src/bin/lvhv-dump.rs"

[dependencies]
lvhv-ngochap = { path = "../ngochap" }
