<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="t d">
  <title id="t">Mâm lễ kiểu chay (Phật giáo)</title>
  <desc id="d">Bàn thờ gỗ, mâm chay: hai cây nến hai bên; đĩa quả và chén trà bên trái; bát hương đồng ở giữa có ba nén hương và bát nước trong phía trước; bát cơm chay và độc bình có hoa sen bên phải.</desc>
  <!-- Vẽ mới cho dự án Lịch và Văn hóa Việt (Clevix Lab), 2026-11-07. Giấy phép MIT. Bản mẫu thiết kế, docs/v0.2/09. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="10%" r="95%">
      <stop offset="0" stop-color="#5a2a1e"/><stop offset=".5" stop-color="#3a1a14"/><stop offset="1" stop-color="#1d0f0c"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4b22"/><stop offset=".6" stop-color="#5a2c12"/><stop offset="1" stop-color="#3d1d0b"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5e0c"/><stop offset=".45" stop-color="#e8c67a"/><stop offset="1" stop-color="#8a5e0c"/>
    </linearGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f1416"/><stop offset=".4" stop-color="#c4161c"/><stop offset="1" stop-color="#8f1416"/>
    </linearGradient>
    <radialGradient id="glow" r=".5">
      <stop offset="0" stop-color="#ffb25a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb25a" stop-opacity="0"/>
    </radialGradient>
    <g id="nen">
      <circle cx="0" cy="-58" r="12" fill="url(#glow)"/>
      <path d="M0 -66 C4 -60 4 -55 0 -52 C-4 -55 -4 -60 0 -66Z" fill="#ffd27a"/>
      <path d="M0 -61 C2 -58 2 -55 0 -54 C-2 -55 -2 -58 0 -61Z" fill="#ff8a3a"/>
      <rect x="-5" y="-52" width="10" height="34" rx="2" fill="url(#candle)"/>
      <ellipse cx="0" cy="-18" rx="9" ry="2.5" fill="#e8c67a"/>
      <rect x="-2" y="-18" width="4" height="12" fill="url(#brass)"/>
      <ellipse cx="0" cy="-6" rx="10" ry="3" fill="url(#brass)"/>
    </g>
  </defs>
  <rect width="360" height="200" rx="14" fill="url(#bg)"/>

  <!-- khói tĩnh -->
  <g fill="none" stroke="#f3e6d0" stroke-linecap="round" stroke-width="3" opacity=".16">
    <path d="M171 46 C164 36 176 28 168 14"/>
    <path d="M180 42 C186 32 176 22 184 8"/>
    <path d="M189 46 C196 38 186 28 194 18"/>
  </g>

  <!-- bàn thờ -->
  <rect x="18" y="148" width="324" height="16" rx="3" fill="#6b3a1c"/>
  <rect x="18" y="148" width="324" height="1.5" fill="#b0703a" opacity=".5"/>
  <rect x="14" y="162" width="332" height="18" rx="4" fill="url(#wood)"/>

  <!-- nến hai bên -->
  <use href="#nen" x="38" y="158"/>
  <use href="#nen" x="322" y="158"/>

  <!-- đĩa quả trên chân gỗ -->
  <g transform="translate(88 156)">
    <path d="M-9 0 L9 0 L5 -11 L-5 -11Z" fill="#5a2c12"/>
    <ellipse cx="0" cy="-12" rx="26" ry="4.5" fill="#8a4b22"/>
    <ellipse cx="0" cy="-14" rx="24" ry="3.5" fill="#d9c49a"/>
    <circle cx="0" cy="-27" r="11" fill="#7fae3e"/>
    <path d="M-3 -36 C0 -40 4 -39 5 -36" stroke="#4f7a3a" stroke-width="2" fill="none"/>
    <circle cx="-14" cy="-19" r="6.5" fill="#e8892b"/>
    <circle cx="14" cy="-19" r="6.5" fill="#e8892b"/>
    <circle cx="-6" cy="-18" r="5.5" fill="#f0a23a"/>
    <circle cx="7" cy="-18" r="5.5" fill="#f0a23a"/>
  </g>

  <!-- chén trà -->
  <g transform="translate(134 156)">
    <ellipse cx="0" cy="-1" rx="11" ry="2.5" fill="#d9c49a"/>
    <path d="M-7 -12 L7 -12 L5 -2 L-5 -2Z" fill="#efe6d6"/>
    <ellipse cx="0" cy="-12" rx="7" ry="1.6" fill="#b08a3e"/>
  </g>

  <!-- bát hương đồng, ba nén hương -->
  <g transform="translate(180 154)">
    <g stroke-linecap="round">
      <line x1="-6" y1="-30" x2="-9" y2="-100" stroke="#7a5a3a" stroke-width="2.4"/>
      <line x1="0" y1="-30" x2="0" y2="-104" stroke="#7a5a3a" stroke-width="2.4"/>
      <line x1="6" y1="-30" x2="9" y2="-100" stroke="#7a5a3a" stroke-width="2.4"/>
      <line x1="-6" y1="-30" x2="-7" y2="-50" stroke="#a3271b" stroke-width="2.4"/>
      <line x1="0" y1="-30" x2="0" y2="-50" stroke="#a3271b" stroke-width="2.4"/>
      <line x1="6" y1="-30" x2="7" y2="-50" stroke="#a3271b" stroke-width="2.4"/>
    </g>
    <circle cx="-9" cy="-101" r="2.2" fill="#ff8a3a"/>
    <circle cx="0" cy="-105" r="2.2" fill="#ff8a3a"/>
    <circle cx="9" cy="-101" r="2.2" fill="#ff8a3a"/>
    <path d="M-30 -32 L30 -32 L22 -6 L-22 -6Z" fill="url(#brass)"/>
    <ellipse cx="0" cy="-32" rx="30" ry="5" fill="#e8c67a"/>
    <ellipse cx="0" cy="-32" rx="26" ry="3.5" fill="#d8cbb0"/>
    <rect x="-14" y="-6" width="28" height="4" rx="1" fill="#8a5e0c"/>
    <circle cx="0" cy="-19" r="5" fill="none" stroke="#8a5e0c" stroke-width="1.2"/>
    <!-- bát nước trong phía trước -->
    <path d="M-8 -1 L8 -1 L5.5 8 L-5.5 8Z" fill="#efe6d6"/>
    <ellipse cx="0" cy="-1" rx="8" ry="1.8" fill="#bcd3dc"/>
  </g>

  <!-- bát cơm chay -->
  <g transform="translate(228 156)">
    <path d="M-12 -14 C-12 -4 -6 0 0 0 C6 0 12 -4 12 -14Z" fill="#c9d6c3"/>
    <path d="M-11 -14 C-9 -25 9 -25 11 -14Z" fill="#fbf7ee"/>
    <path d="M-5 -19 h1.5 M2 -21 h1.5 M5 -17 h1.5 M-2 -16 h1.5" stroke="#e2d8c3" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M-12 -12 H12" stroke="#8fa587" stroke-width="1"/>
    <rect x="-5" y="-1" width="10" height="2.5" rx="1" fill="#a9b8a2"/>
  </g>

  <!-- độc bình hoa sen -->
  <g transform="translate(278 156)">
    <g stroke="#5f8f4a" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M0 -38 C-1 -52 -1 -62 0 -76"/>
      <path d="M0 -38 C4 -50 10 -56 14 -62"/>
      <path d="M0 -38 C-4 -46 -12 -50 -18 -52"/>
    </g>
    <path d="M-30 -56 C-26 -64 -14 -62 -12 -52 C-20 -48 -28 -50 -30 -56Z" fill="#5f8f4a"/>
    <path d="M-21 -55 L-14 -53" stroke="#4f7a3a" stroke-width="1"/>
    <!-- sen nở -->
    <g transform="translate(0 -80)">
      <path d="M0 -12 C5 -6 5 2 0 6 C-5 2 -5 -6 0 -12Z" fill="#f3c1cc"/>
      <path d="M-2 4 C-12 0 -14 -8 -11 -12 C-5 -8 -2 -2 -2 4Z" fill="#e7a3b3"/>
      <path d="M2 4 C12 0 14 -8 11 -12 C5 -8 2 -2 2 4Z" fill="#e7a3b3"/>
      <path d="M-3 6 C-14 6 -18 0 -18 -4 C-10 -2 -5 2 -3 6Z" fill="#d9879b"/>
      <path d="M3 6 C14 6 18 0 18 -4 C10 -2 5 2 3 6Z" fill="#d9879b"/>
    </g>
    <!-- nụ sen -->
    <path d="M14 -62 C10 -66 10 -74 16 -80 C20 -74 20 -66 14 -62Z" fill="#e7a3b3"/>
    <!-- bình -->
    <path d="M-5 -40 C-5 -34 -13 -28 -13 -16 C-13 -6 -8 0 -6 0 L6 0 C8 0 13 -6 13 -16 C13 -28 5 -34 5 -40Z" fill="#c9d6c3"/>
    <path d="M-6 -41 H6" stroke="#a9b8a2" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-12.6 -14 H12.6" stroke="#8fa587" stroke-width="1"/>
  </g>
</svg>
