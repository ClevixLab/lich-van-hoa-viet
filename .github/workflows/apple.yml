# iOS + macOS: dựng XCFramework từ Rust, sinh dự án bằng XcodeGen, dựng KHÔNG ký
# (CODE_SIGNING_ALLOWED=NO) app iOS Simulator và app macOS để kiểm tra; tải lên dạng .zip.
# Ký và nộp App Store cần chứng chỉ của chủ dự án — xem docs/04-BUILD-NATIVE.md.
name: apple

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# DV23-07: mặc định chỉ đọc. Hai job có bước ghi ảnh chụp vào nhánh PR mới xin `contents: write`, và mã thông báo chỉ đưa
# cho đúng bước đó (checkout không giữ thông tin xác thực: kịch bản dựng và kiểm thử của PR không thấy mã thông báo).
permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Chỉ hủy run cũ của PR; mỗi commit trên main/thẻ đều được dựng trọn (push dồn dập không làm mất kết quả).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  XCODEGEN_VERSION: "2.42.0"

jobs:
  build:
    permissions:
      contents: write
    # macos-15 có Xcode 16.x (Swift 5.10/6), hỗ trợ iOS 16 / macOS 13 làm mục tiêu triển khai.
    runs-on: macos-15
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Chọn Xcode 16
        run: |
          X=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          echo "Dùng $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple

      - name: Cài XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Dự phòng — brew install xcodegen nếu tải bản ghim thất bại
        run: command -v xcodegen || brew install xcodegen

      - name: Dựng XCFramework + mã Swift UniFFI + Version.xcconfig (từ VERSION)
        env:
          LVHV_BUILD_NUMBER: ${{ github.run_number }}
          APP_STORE_ID: ${{ vars.LVHV_APP_STORE_ID }}
        run: |
          export LVHV_BUILD_DATE="$(date -u +%Y-%m-%d)"
          apps/apple/build-xcframework.sh
          cat apps/apple/Generated/Version.xcconfig

      - name: XcodeGen
        working-directory: apps/apple
        run: |
          xcodegen --version
          xcodegen generate

      - name: xcodebuild — iOS Simulator (không ký)
        working-directory: apps/apple
        run: |
          set -o pipefail
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-iOS -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/ios.log

      - name: xcodebuild — iOS thiết bị (không ký, chỉ kiểm tra biên dịch arm64)
        working-directory: apps/apple
        run: |
          set -o pipefail
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-iOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/ios-device.log

      - name: xcodebuild — macOS (không ký)
        working-directory: apps/apple
        run: |
          set -o pipefail
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-macOS -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tee build/macos.log

      - name: Kiểm tra — không có quyền mạng, có PrivacyInfo, có phông
        working-directory: apps/apple/build/dd/Build/Products
        run: |
          MAC="Release/Lịch và Văn hóa Việt.app"
          IOS="Release-iphonesimulator/LichViet.app"
          test -d "$MAC" && test -d "$IOS"
          test -f "$IOS/PrivacyInfo.xcprivacy"
          test -f "$MAC/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$IOS/LVHVSerif-Regular.ttf"
          if grep -E "<key>com\.apple\.security\.network" ../../../../macOS/LichViet.entitlements; then
            echo "::error::Có quyền mạng trong entitlements"; exit 1
          fi
          # Phiên bản trong Info.plist của cả hai app phải bằng tệp VERSION; số bản dựng = run_number.
          V="$(tr -d '[:space:]' < ../../../../../../VERSION)"
          for P in "$IOS/Info.plist" "$MAC/Contents/Info.plist"; do
            SV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$P")
            BV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$P")
            BD=$(/usr/libexec/PlistBuddy -c "Print :LVHVBuildDate" "$P")
            echo "$P: $SV ($BV), ngày dựng $BD"
            [ "$SV" = "$V" ] || { echo "::error::$P có CFBundleShortVersionString=$SV, khác VERSION=$V"; exit 1; }
            [ "$BV" = "${{ github.run_number }}" ] || { echo "::error::$P có CFBundleVersion=$BV, khác run_number"; exit 1; }
            echo "$BD" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "::error::LVHVBuildDate sai: $BD"; exit 1; }
          done
          # Quyền mạng thật của bản macOS đã dựng (đọc entitlements nhúng nếu có).
          if codesign -d --entitlements :- "$MAC" 2>/dev/null | grep -q "com.apple.security.network"; then
            echo "::error::app macOS có quyền mạng"; exit 1
          fi
          # DV23-08: mã chỉ-Debug (DemoSeed, màn hình kiểm tra R14, gói ảnh thử) không được có trong bản Release.
          # Dấu hiệu là chuỗi dài (> 15 byte, Swift không nhúng thẳng vào lệnh) chỉ có trong mã #if DEBUG.
          for APP in "$IOS" "$MAC"; do
            for MARK in "Kiểm tra sau nâng cấp (R14)" "Gia đình đã báo cho họ hàng."; do
              if grep -rqaF "$MARK" "$APP"; then echo "::error::$APP (Release) có mã kiểm thử: $MARK"; exit 1; fi
            done
          done
          echo "Bản Release không có mã kiểm thử."
          ditto -c -k --sequesterRsrc --keepParent "$IOS" "$RUNNER_TEMP/LichViet-iOS-simulator.zip"
          ditto -c -k --sequesterRsrc --keepParent "$MAC" "$RUNNER_TEMP/LichViet-macOS-unsigned.zip"
          ls -la "$RUNNER_TEMP"/*.zip

      - name: Kiểm thử đơn vị + giao diện (iPhone mô phỏng, Debug) và ảnh chụp "Người thân"
        working-directory: apps/apple
        run: |
          set -o pipefail
          PHONE=$(python3 ci/pick_sim.py iPhone "iPhone 16" "iPhone 16 Pro" "iPhone 15")
          IPAD=$(python3 ci/pick_sim.py iPad "iPad Air 11-inch (M2)" "iPad Pro 11-inch (M4)" "iPad (10th generation)")
          echo "PHONE=$PHONE IPAD=$IPAD"
          echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          for U in $PHONE $IPAD; do
            xcrun simctl boot "$U" || true
            xcrun simctl status_bar "$U" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          done
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-iOS -configuration Debug \
            -destination "id=$PHONE" -derivedDataPath build/ddt \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build-for-testing | tee build/test-build.log
          # DV23-08 đối chứng: bản Debug phải có dấu hiệu mà bước kiểm bản Release tìm (nếu không, phép kiểm vô nghĩa).
          DBG=build/ddt/Build/Products/Debug-iphonesimulator/LichViet.app
          grep -rqaF "Kiểm tra sau nâng cấp (R14)" "$DBG" || { echo "::error::Đối chứng hỏng: bản Debug không có dấu hiệu"; exit 1; }
          mkdir -p "$RUNNER_TEMP/shots"
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" TEST_RUNNER_SHOT_PREFIX=ios \
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-iOS -configuration Debug \
            -destination "id=$PHONE" -derivedDataPath build/ddt -resultBundlePath build/ios-tests.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building | tee build/ios-tests.log

      - name: Ảnh chụp bố cục iPad
        if: always() && env.IPAD != ''
        continue-on-error: true
        working-directory: apps/apple
        run: |
          set -o pipefail
          TEST_RUNNER_SCREENSHOT_DIR="$RUNNER_TEMP/shots" TEST_RUNNER_SHOT_PREFIX=ipad \
          xcodebuild -project LichVanHoaViet.xcodeproj -scheme LichViet-iOS -configuration Debug \
            -destination "id=$IPAD" -derivedDataPath build/ddt -resultBundlePath build/ipad-tests.xcresult \
            -only-testing:LichVietUITests-iOS/PeopleUITests/testScreenshotsLight \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test-without-building | tee build/ipad-tests.log

      - name: Ghi ảnh chụp vào nhánh PR (apps/apple/screenshots/)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_NO: ${{ github.run_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash apps/apple/ci/commit_shots.sh

      - name: Chạy thử trên iOS Simulator (khởi động và chụp màn hình)
        continue-on-error: true
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "apps/apple/build/dd/Build/Products/Release-iphonesimulator/LichViet.app"
          xcrun simctl launch "$UDID" vn.clevix.lichviet
          sleep 8
          xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/ios-sim.png"

      - uses: actions/upload-artifact@v4
        with:
          name: apple-unsigned
          path: |
            ${{ runner.temp }}/LichViet-iOS-simulator.zip
            ${{ runner.temp }}/LichViet-macOS-unsigned.zip
            ${{ runner.temp }}/ios-sim.png
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apple-logs
          path: apps/apple/build/*.log
          retention-days: 14

  # R14 (04 Bổ sung B5): cài bản cũ, tạo dữ liệu, cài đè bản mới trên iPhone mô phỏng; dữ liệu phải còn nguyên.
  upgrade:
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Chọn Xcode 16
        run: |
          X=$(find /Applications -maxdepth 1 -name 'Xcode_16*.app' | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple
      - name: Cài XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Dự phòng — brew install xcodegen
        run: command -v xcodegen || brew install xcodegen
      - name: Dựng XCFramework (dùng chung cho bản cũ và bản mới — lõi không đổi giữa các bản thử)
        env:
          LVHV_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export LVHV_BUILD_DATE="$(date -u +%Y-%m-%d)"
          apps/apple/build-xcframework.sh
          cd apps/apple && xcodegen generate
      - name: R14 — nâng cấp tại chỗ (0.1 → mới, 0.2-dev → mới)
        run: bash apps/apple/ci/upgrade.sh
      - name: Ghi ảnh nâng cấp vào nhánh PR (apps/apple/screenshots/upgrade/)
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_NO: ${{ github.run_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUBDIR: upgrade
          RESULT: ${{ runner.temp }}/r14/upgrade.xcresult
          GH_TOKEN: ${{ github.token }}
        run: SHOTS="$RUNNER_TEMP/shots-upgrade" bash apps/apple/ci/commit_shots.sh
