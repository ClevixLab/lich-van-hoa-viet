# Kiểm tra chung: Rust (fmt, clippy, test, kiểm tra phụ thuộc), tsport so với lõi (L7), PWA (build +
# kiểm thử khói Playwright). Chạy trên mọi push và pull request.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy lvhv-store-tool với test-hooks (-D warnings)
        run: cargo clippy --locked -p lvhv-ffi --features test-hooks --bin lvhv-store-tool -- -D warnings
      - name: test (core, ngochap, ffi, store, backup)
        run: cargo test --workspace --release
      - name: S1/S8 — lvhv-store, lvhv-backup cấm unsafe; phụ thuộc mật mã ghim chính xác
        run: |
          for f in store/src/lib.rs backup/src/lib.rs; do grep -q '#!\[forbid(unsafe_code)\]' "$f" || { echo "::error::$f thiếu #![forbid(unsafe_code)]"; exit 1; }; done
          for c in argon2 chacha20poly1305 zeroize; do
            grep -Eq "^$c = \{ version = \"=[0-9]+\.[0-9]+\.[0-9]+\"" backup/Cargo.toml || { echo "::error::$c không ghim =x.y.z (S11)"; exit 1; }
          done
      - name: S1 — không có unsafe trong lvhv-core
        run: |
          # bỏ qua dòng chú thích (//, //!, ///) và thuộc tính #![forbid(unsafe_code)]
          if grep -rn --include='*.rs' -E '\bunsafe\b' core/src | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|#!\[forbid\(unsafe_code\)\])'; then
            echo "::error::Tìm thấy unsafe trong core/src (tiêu chí S1)"; exit 1
          fi
          grep -q '#!\[forbid(unsafe_code)\]' core/src/lib.rs
          grep -q '#!\[forbid(unsafe_code)\]' memorial/src/lib.rs
          if grep -rn --include='*.rs' -E '\bunsafe\b' memorial/src | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|#!\[forbid\(unsafe_code\)\])'; then
            echo "::error::Tìm thấy unsafe trong memorial/src"; exit 1
          fi
          # lvhv-memorial chỉ phụ thuộc lvhv-core (docs/v0.2/05 §2)
          test "$(cargo tree -p lvhv-memorial -e normal --prefix none | sort -u | awk '{print $1}' | tr '\n' ' ')" = "lvhv-core lvhv-memorial lvhv-ngochap "
      - name: FFI — sinh lại mã Kotlin/Swift và so với ffi/generated
        run: |
          cargo build -p lvhv-ffi --release --lib
          cargo build -p lvhv-ffi --features bindgen-cli --bin uniffi-bindgen
          rm -rf "$RUNNER_TEMP/gen"
          for L in kotlin swift; do
            target/debug/uniffi-bindgen generate --library target/release/liblvhv_ffi.so \
              --language "$L" --out-dir "$RUNNER_TEMP/gen/$L" --config ffi/uniffi.toml --no-format
          done
          if ! diff -r "$RUNNER_TEMP/gen" ffi/generated; then
            echo "::warning::ffi/generated cũ so với mã nguồn — chạy lại lệnh sinh mã (docs/04-BUILD-NATIVE.md §2) và commit."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ffi-bindings
          path: ${{ runner.temp }}/gen
          retention-days: 14

  memorial-parity:
    name: v0.2 lvhv-memorial — Rust ≡ TypeScript (R1/R3/R10/R11/R12/.ics)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: npm ci (pwa — tsc/esbuild cho tsport)
        working-directory: pwa
        run: npm ci
      - name: check-parity.sh --memorial-only
        run: scripts/check-parity.sh --memorial-only

  deps:
    name: Kiểm tra phụ thuộc (cargo-deny advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # deny.toml [graph] all-features = true: xét cả phụ thuộc lúc dựng chỉ đến qua tính năng không mặc định
      # (bindgen-cli, test-hooks). Mọi cảnh báo RustSec chưa có ngoại lệ ghi lý do trong deny.toml → job lỗi.
      - name: S11 — đồ thị cargo-deny phủ mọi gói của Cargo.lock (workspace gốc)
        run: python3 scripts/check-lock-coverage.py
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans
          arguments: --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: S11 — npm audit (phụ thuộc chạy trong PWA, gồm @noble/*)
        working-directory: pwa
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=low
          node -e 'const p=require("./package.json");for(const [k,v] of Object.entries({...p.dependencies,...p.devDependencies}))if(!/^\d+\.\d+\.\d+$/.test(v)){console.error(`::error::${k} không ghim chính xác: ${v}`);process.exit(1)}'

  store:
    name: Lưu trữ + sao lưu (R6, vector 03 §2.5, Rust ↔ PWA)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: npm ci (pwa)
        working-directory: pwa
        run: npm ci
      - name: vector tất định + R6 phía PWA (gồm lật bit 65 536 biến thể) + kiểm chéo Rust ↔ PWA
        run: scripts/check-store.sh
      - name: công cụ hộp đen lvhv-store-tool (Rust + TS) trên test-vectors (docs/v0.2/10)
        run: scripts/check-store-tool.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-r6
          path: |
            pwa/test/store/out/results.json
            pwa/test/store/out/*.lvhv
          retention-days: 14

  l7-pwa:
    name: L7 (tsport = core) + PWA build + smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Dựng lvhv-dump và sinh dữ liệu đối chiếu (core/out bị .gitignore)
        run: |
          cargo build -p lvhv-core --release --bin lvhv-dump
          D=target/release/lvhv-dump
          mkdir -p core/out/precise core/out/jpl
          for M in hnd precise jpl; do
            O=core/out; [ "$M" = precise ] && O=core/out/precise; [ "$M" = jpl ] && O=core/out/jpl
            # tsport/test/compare.mjs so dải 1900–3000 (bổ sung A1, L12)
            $D --method $M dayinfo-jsonl 1900-01-01 3000-12-31 | gzip -1 > $O/dayinfo_1900_3000.jsonl.gz
            $D --method $M tet 1900 1999 > $O/tet_1900_1999.csv
            $D --method $M tet 2000 3000 > $O/tet.csv
            { $D --method $M gooddays all 2026-01-01 2026-12-31 none
              $D --method $M gooddays all 2026-01-01 2026-12-31 1976; } > $O/gooddays_sample.jsonl
          done
          ls -la core/out core/out/precise core/out/jpl
      - name: npm ci (pwa)
        working-directory: pwa
        run: npm ci
      - name: tsport — build + so sánh L7
        working-directory: tsport
        run: npm test
      - name: PWA — typecheck + build
        working-directory: pwa
        run: |
          npm run build      # sinh src/gen/ trước, typecheck cần các tệp này
          npm run typecheck
      - name: Cài Chromium cho Playwright
        working-directory: pwa
        run: npx playwright-core install --with-deps chromium
      - name: PWA — kiểm thử khói
        working-directory: pwa
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pwa-smoke
          path: |
            pwa/test/metrics.json
            pwa/test/shots/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 14
