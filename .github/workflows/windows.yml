# Windows: dựng LichViet.exe (Rust + Slint 1.8.0, toolchain MSVC), gói .zip và .msi (WiX 3.14 qua
# cargo-wix 0.3.9). Ký mã (Authenticode) chỉ chạy khi có secret LVHV_WIN_CERT_PFX_BASE64.
name: windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Đăng bộ cài lên GitHub Releases (thẻ v<VERSION> được tạo tự động)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Chỉ hủy run cũ của PR; mỗi commit trên main/thẻ đều được dựng trọn (push dồn dập không làm mất kết quả).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_WIX_VERSION: "0.3.9"

jobs:
  build:
    permissions:
      contents: write   # cần để đăng GitHub Releases khi đẩy thẻ v*
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.LVHV_WIN_CERT_PFX_BASE64 != '' }}
      LVHV_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Ngày dựng + kiểm Cargo.toml khớp VERSION
        working-directory: apps/windows
        run: |
          "LVHV_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $v = (Get-Content ..\..\VERSION -Raw).Trim()
          $c = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($c -ne $v) { Write-Host "::error::apps/windows/Cargo.toml version=$c khác VERSION=$v"; exit 1 }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Host "::error::VERSION phải có dạng X.Y.Z"; exit 1 }
          Write-Host "Phiên bản $v"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows -> target
          key: windows

      # Gồm cả kiểm thử giao diện (src/ui_tests.rs, backend kiểm thử của Slint): bấm chuột giả lập vào
      # mọi nút của tờ lịch (Chi tiết, Xem thêm, dải tháng, bảng tháng), Chọn ngày tốt, Đổi ngày, Giới thiệu.
      - name: Kiểm thử (cargo test, gồm kiểm thử giao diện)
        working-directory: apps/windows
        run: cargo test

      - name: Dựng release
        working-directory: apps/windows
        run: cargo build --release

      - name: Đo bộ nhớ khi chạy (khởi động 8 giây, đọc Working Set)
        working-directory: apps/windows
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath target\release\LichViet.exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          "Tờ lịch (khởi động): Working set {0:N1} MB; Private {1:N1} MB" -f ($p.WorkingSet64/1MB), ($p.PrivateMemorySize64/1MB) | Tee-Object -FilePath $env:RUNNER_TEMP\mem.txt
          Stop-Process -Id $p.Id -Force
          # Mô-đun Người thân với dữ liệu mẫu (kho tạm): Sắp tới, Theo kỳ năm, hồ sơ có ảnh, trang tưởng niệm.
          $p = Start-Process -FilePath target\release\LichViet.exe -ArgumentList '--do-bo-nho' -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          "Người thân + tưởng niệm (5 hồ sơ, 2 ảnh): Working set {0:N1} MB; Private {1:N1} MB; đỉnh Working set {2:N1} MB" -f ($p.WorkingSet64/1MB), ($p.PrivateMemorySize64/1MB), ($p.PeakWorkingSet64/1MB) | Tee-Object -FilePath $env:RUNNER_TEMP\mem.txt -Append
          Stop-Process -Id $p.Id -Force

      # Chạy bản release ở chế độ chụp màn hình: mở lần lượt các màn hình (v0.1 và mô-đun Người thân, sáng và tối),
      # chụp bằng chính renderer của ứng dụng (Window::take_snapshot, Skia) rồi tự thoát. Hai lần: tỉ lệ 1× và 2×
      # (SLINT_SCALE_FACTOR=2). Ảnh đính kèm trong artifact "windows-screens" và được commit vào nhánh của PR
      # (apps/windows/screenshots/) ở bước cuối.
      - name: Chụp màn hình (1× và 2×, sáng và tối)
        working-directory: apps/windows
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'screens'
          foreach ($sf in @('1', '2')) {
            $env:SLINT_SCALE_FACTOR = $sf
            $p = Start-Process -FilePath target\release\LichViet.exe -ArgumentList '--chup-man-hinh', $out -PassThru
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error::Chụp màn hình ($sf×) quá 240 giây"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Host "::error::LichViet.exe --chup-man-hinh ($sf×) thoát mã $($p.ExitCode)"; exit 1 }
          }
          Remove-Item Env:SLINT_SCALE_FACTOR
          Add-Type -AssemblyName System.Drawing
          $shots = Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue
          $shots | ForEach-Object { $i = [System.Drawing.Image]::FromFile($_.FullName); "{0}  {1}x{2}  {3:N0} byte" -f $_.Name, $i.Width, $i.Height, $_.Length; $i.Dispose() }
          if ($shots.Count -lt 184) { Write-Host "::error::Chỉ có $($shots.Count)/184 ảnh"; exit 1 }
          $small = $shots | Where-Object { $_.Length -lt 20000 }
          if ($small) { Write-Host "::error::Ảnh quá nhỏ (có thể trống): $($small.Name -join ', ')"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Ký mã (nếu có chứng chỉ)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          PFX_B64: ${{ secrets.LVHV_WIN_CERT_PFX_BASE64 }}
          PFX_PW: ${{ secrets.LVHV_WIN_CERT_PASSWORD }}
        working-directory: apps/windows
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PW target\release\LichViet.exe
          Remove-Item $pfx -Force

      - name: Gói .zip
        working-directory: apps/windows
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist\LichViet-$v-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\LichViet.exe $stage
          Copy-Item ui\fonts\OFL.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\LichViet-$v-x64.zip" -Force

      - name: Cài cargo-wix ${{ env.CARGO_WIX_VERSION }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix@${{ env.CARGO_WIX_VERSION }}

      - name: Gói .msi (WiX 3.14)
        working-directory: apps/windows
        run: |
          # windows-2022 có sẵn WiX 3.14 (biến WIX). Nếu thiếu thì cài qua Chocolatey.
          if (-not $env:WIX) { choco install wixtoolset --version 3.14.1 -y --no-progress; $env:WIX = 'C:\Program Files (x86)\WiX Toolset v3.14\' }
          cargo wix --no-build --nocapture --output "dist\LichViet-$env:VERSION-x64.msi"

      - name: Kiểm tra — phiên bản trong .exe và .msi khớp VERSION
        working-directory: apps/windows
        run: |
          $v = (Get-Content ..\..\VERSION -Raw).Trim()
          $fv = (Get-Item target\release\LichViet.exe).VersionInfo
          Write-Host "exe: ProductVersion=$($fv.ProductVersion) FileVersion=$($fv.FileVersion)"
          if (-not ($fv.ProductVersion -like "$v*")) { Write-Host "::error::ProductVersion của .exe ($($fv.ProductVersion)) khác VERSION $v"; exit 1 }
          $msi = (Resolve-Path "dist\LichViet-$v-x64.msi").Path
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $inst, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $pv = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          Write-Host "msi: ProductVersion=$pv"
          if ($pv -ne $v) { Write-Host "::error::ProductVersion của MSI ($pv) khác VERSION $v"; exit 1 }

      # R-WIN-1: thông báo đặt lịch của ứng dụng chưa đóng gói cần lối tắt Start Menu mang AppUserModelID. Cài .msi
      # (theo người dùng) rồi chạy bản đã cài với --kiem-thong-bao: đặt một thông báo thử sau 1 giờ, đọc lại danh
      # sách chờ của Windows, gỡ nó. Máy CI là Windows Server chạy dịch vụ, có thể không có nền tảng thông báo —
      # kết quả chỉ để tham khảo, R5 Windows vẫn phải thử trên máy thật.
      - name: Thử thông báo đặt lịch sau khi cài .msi (R-WIN-1)
        working-directory: apps/windows
        continue-on-error: true
        run: |
          $msi = (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $i = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          "msiexec /i thoát mã $($i.ExitCode)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'Lich va Van hoa Viet.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          "Lối tắt Start Menu: $($lnk.FullName)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          $proto = (Get-ItemProperty -Path 'HKCU:\Software\Classes\lichviet\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          "Giao thức lichviet: $proto" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\LichVanHoaViet\LichViet.exe'
          $o = Join-Path $env:RUNNER_TEMP 'toast-out.txt'; $e = Join-Path $env:RUNNER_TEMP 'toast-err.txt'
          $t = Start-Process -FilePath $exe -ArgumentList '--kiem-thong-bao' -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
          "--kiem-thong-bao thoát mã $($t.ExitCode)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          Get-Content $o, $e | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/windows/dist/*.zip
            apps/windows/dist/*.msi
            ${{ runner.temp }}/mem.txt
            ${{ runner.temp }}/toast.txt
          retention-days: 30

      # Tải tạo phẩm bị chặn trong môi trường duyệt, nên ảnh chụp (và số đo bộ nhớ, kết quả thử thông báo) được
      # commit vào chính nhánh của PR (apps/windows/screenshots/). Chỉ với PR từ nhánh trong kho; commit có
      # "[skip ci]" để không chạy lại.
      - name: Commit ảnh chụp vào nhánh của PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $wt = Join-Path $env:RUNNER_TEMP 'shots-wt'
          git fetch --depth=1 origin "$env:HEAD_REF"
          git worktree add --detach $wt FETCH_HEAD
          $dst = Join-Path $wt 'apps\windows\screenshots'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'screens\*.png') $dst
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'mem.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'mem.txt') (Join-Path $dst 'bo-nho.txt') }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'toast.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'toast.txt') (Join-Path $dst 'thong-bao.txt') }
          git -C $wt add -A apps/windows/screenshots
          git -C $wt diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Ảnh không đổi"; exit 0 }
          git -C $wt commit -q -m "Ảnh chụp Windows từ CI (run ${{ github.run_number }}) [skip ci]"
          git -C $wt push origin "HEAD:refs/heads/$env:HEAD_REF"

      # Chỉ khi đẩy thẻ phiên bản (v*): tạo bản phát hành (pre-release) trên GitHub và đính kèm .msi/.zip.
      - name: Đăng lên GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}" } else { "v" + (Get-Content VERSION -Raw).Trim() }
          $repo = "${{ github.repository }}"
          $notes = @"
          Bản thử nghiệm Lịch và Văn hóa Việt $tag cho Windows 10/11 (64-bit).

          - **LichViet-*-x64.msi**: bộ cài, bấm đúp để cài.
          - **LichViet-*-x64.zip**: bản chạy không cần cài, giải nén rồi mở LichViet.exe.

          Bản này **chưa được ký số**, nên Windows có thể hiện "Windows protected your PC". Bấm **More info → Run anyway** để chạy.
          Ứng dụng không kết nối mạng và không thu thập dữ liệu. Thay đổi: xem CHANGELOG.md.
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release view $tag -R $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $repo --target "${{ github.sha }}" --prerelease --title "Lịch và Văn hóa Việt $tag" --notes-file release-notes.md
          }
          gh release upload $tag -R $repo --clobber (Get-ChildItem apps/windows/dist/*.msi).FullName (Get-ChildItem apps/windows/dist/*.zip).FullName
