# Windows: dựng LichViet.exe (Rust + Slint 1.8.0, toolchain MSVC), gói .zip và .msi (WiX 3.14 qua
# cargo-wix 0.3.9). Ký mã (Authenticode) chỉ chạy khi có secret LVHV_WIN_CERT_PFX_BASE64.
name: windows

# Chỉ chạy khi mã hay dữ liệu mà bản Windows dùng thay đổi (đường lọc không áp cho thẻ v*: thẻ luôn dựng).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/windows/**"
      - "core/**"
      - "ngochap/**"
      - "store/**"
      - "backup/**"
      - "ffi/**"
      - "memorial/**"
      - "content/memorial/trays/**"
      - "scripts/check-tray-pack.py"
      - "docs/v0.2/schema/test-vectors/released/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "core/**"
      - "ngochap/**"
      - "store/**"
      - "backup/**"
      - "ffi/**"
      - "memorial/**"
      - "content/memorial/trays/**"
      - "scripts/check-tray-pack.py"
      - "docs/v0.2/schema/test-vectors/released/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - ".github/workflows/windows.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Đăng bộ cài lên GitHub Releases (thẻ v<VERSION> được tạo tự động)"
        type: boolean
        default: false

permissions:
  contents: read

# Một run cho mỗi nhánh PR: commit mới hủy run cũ. Trên main/thẻ mỗi commit vẫn được dựng trọn (nhóm có sha) để push
# dồn dập không làm mất kết quả.
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_WIX_VERSION: "0.3.9"

jobs:
  build:
    permissions:
      contents: write   # cần để đăng GitHub Releases khi đẩy thẻ v*
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      HAS_CERT: ${{ secrets.LVHV_WIN_CERT_PFX_BASE64 != '' }}
      LVHV_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Ngày dựng + kiểm Cargo.toml khớp VERSION
        working-directory: apps/windows
        run: |
          "LVHV_BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $v = (Get-Content ..\..\VERSION -Raw).Trim()
          $c = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($c -ne $v) { Write-Host "::error::apps/windows/Cargo.toml version=$c khác VERSION=$v"; exit 1 }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { Write-Host "::error::VERSION phải có dạng X.Y.Z"; exit 1 }
          Write-Host "Phiên bản $v"
      # YC-2026-10 (08 §16.3, 04 R15 (b)): gói ảnh mâm lễ nhúng lúc dựng phải đạt kiểm đầy đủ (siêu dữ liệu, cỡ tệp,
      # kích thước) trước khi build.rs nhúng; build.rs tự kiểm thêm tệp, sha256 và chữ ký.
      - name: Kiểm gói ảnh mâm lễ trước khi nhúng
        run: python scripts/check-tray-pack.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows -> target
          key: windows

      # Gồm cả kiểm thử giao diện (src/ui_tests.rs, backend kiểm thử của Slint): bấm chuột giả lập vào
      # mọi nút của tờ lịch (Chi tiết, Xem thêm, dải tháng, bảng tháng), Chọn ngày tốt, Đổi ngày, Giới thiệu.
      - name: Kiểm thử (cargo test, gồm kiểm thử giao diện)
        working-directory: apps/windows
        run: cargo test

      - name: Dựng release
        working-directory: apps/windows
        run: cargo build --release

      - name: Đo bộ nhớ khi chạy (khởi động 8 giây, đọc Working Set)
        working-directory: apps/windows
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath target\release\LichViet.exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          "Tờ lịch (khởi động): Working set {0:N1} MB; Private {1:N1} MB" -f ($p.WorkingSet64/1MB), ($p.PrivateMemorySize64/1MB) | Tee-Object -FilePath $env:RUNNER_TEMP\mem.txt
          Stop-Process -Id $p.Id -Force
          # Mô-đun Người thân với dữ liệu mẫu (kho tạm): Sắp tới, Theo kỳ năm, hồ sơ có ảnh, trang tưởng niệm.
          $p = Start-Process -FilePath target\release\lvhv-ci-check.exe -ArgumentList '--do-bo-nho' -PassThru
          Start-Sleep -Seconds 12
          $p.Refresh()
          "Người thân + tưởng niệm (5 hồ sơ, 2 ảnh): Working set {0:N1} MB; Private {1:N1} MB; đỉnh Working set {2:N1} MB" -f ($p.WorkingSet64/1MB), ($p.PrivateMemorySize64/1MB), ($p.PeakWorkingSet64/1MB) | Tee-Object -FilePath $env:RUNNER_TEMP\mem.txt -Append
          Stop-Process -Id $p.Id -Force

      # Chạy bản release ở chế độ chụp màn hình: mở lần lượt các màn hình (v0.1 và mô-đun Người thân, sáng và tối),
      # chụp bằng chính renderer của ứng dụng (Window::take_snapshot, Skia) rồi tự thoát. Hai lần: tỉ lệ 1× và 2×
      # (SLINT_SCALE_FACTOR=2). Ảnh đính kèm trong artifact "windows-screens" và được commit vào nhánh của PR
      # (apps/windows/screenshots/) ở bước cuối.
      - name: Chụp màn hình (1× và 2×, sáng và tối)
        working-directory: apps/windows
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'screens'
          foreach ($sf in @('1', '2')) {
            $env:SLINT_SCALE_FACTOR = $sf
            $p = Start-Process -FilePath target\release\lvhv-ci-check.exe -ArgumentList '--chup-man-hinh', $out -PassThru
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error::Chụp màn hình ($sf×) quá 240 giây"; exit 1 }
            if ($p.ExitCode -ne 0) { Write-Host "::error::lvhv-ci-check.exe --chup-man-hinh ($sf×) thoát mã $($p.ExitCode)"; exit 1 }
          }
          Remove-Item Env:SLINT_SCALE_FACTOR
          Add-Type -AssemblyName System.Drawing
          $shots = Get-ChildItem $out -Filter *.png -ErrorAction SilentlyContinue
          $shots | ForEach-Object { $i = [System.Drawing.Image]::FromFile($_.FullName); "{0}  {1}x{2}  {3:N0} byte" -f $_.Name, $i.Width, $i.Height, $_.Length; $i.Dispose() }
          if ($shots.Count -lt 220) { Write-Host "::error::Chỉ có $($shots.Count)/220 ảnh"; exit 1 }
          $small = $shots | Where-Object { $_.Length -lt 20000 }
          if ($small) { Write-Host "::error::Ảnh quá nhỏ (có thể trống): $($small.Name -join ', ')"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: ${{ runner.temp }}/screens/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Ký mã (nếu có chứng chỉ)
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          PFX_B64: ${{ secrets.LVHV_WIN_CERT_PFX_BASE64 }}
          PFX_PW: ${{ secrets.LVHV_WIN_CERT_PASSWORD }}
        working-directory: apps/windows
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:PFX_PW target\release\LichViet.exe
          Remove-Item $pfx -Force

      - name: Gói .zip
        working-directory: apps/windows
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = "dist\LichViet-$v-x64"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\LichViet.exe $stage
          Copy-Item ui\fonts\OFL.txt $stage
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\LichViet-$v-x64.zip" -Force

      - name: Cài cargo-wix ${{ env.CARGO_WIX_VERSION }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix@${{ env.CARGO_WIX_VERSION }}

      - name: Gói .msi (WiX 3.14)
        working-directory: apps/windows
        run: |
          # windows-2022 có sẵn WiX 3.14 (biến WIX). Nếu thiếu thì cài qua Chocolatey.
          if (-not $env:WIX) { choco install wixtoolset --version 3.14.1 -y --no-progress; $env:WIX = 'C:\Program Files (x86)\WiX Toolset v3.14\' }
          cargo wix --no-build --nocapture --output "dist\LichViet-$env:VERSION-x64.msi"

      - name: Kiểm tra — phiên bản trong .exe và .msi khớp VERSION
        working-directory: apps/windows
        run: |
          $v = (Get-Content ..\..\VERSION -Raw).Trim()
          $fv = (Get-Item target\release\LichViet.exe).VersionInfo
          Write-Host "exe: ProductVersion=$($fv.ProductVersion) FileVersion=$($fv.FileVersion)"
          if (-not ($fv.ProductVersion -like "$v*")) { Write-Host "::error::ProductVersion của .exe ($($fv.ProductVersion)) khác VERSION $v"; exit 1 }
          $msi = (Resolve-Path "dist\LichViet-$v-x64.msi").Path
          $inst = New-Object -ComObject WindowsInstaller.Installer
          $db = $inst.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $inst, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $pv = $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          Write-Host "msi: ProductVersion=$pv"
          if ($pv -ne $v) { Write-Host "::error::ProductVersion của MSI ($pv) khác VERSION $v"; exit 1 }

      # R-WIN-1: thông báo đặt lịch của ứng dụng chưa đóng gói cần lối tắt Start Menu mang AppUserModelID. Cài .msi
      # (theo người dùng) rồi chạy bản đã cài với --kiem-thong-bao: đặt một thông báo thử sau 1 giờ, đọc lại danh
      # sách chờ của Windows, gỡ nó. Máy CI là Windows Server chạy dịch vụ, có thể không có nền tảng thông báo —
      # kết quả chỉ để tham khảo, R5 Windows vẫn phải thử trên máy thật.
      - name: Thử thông báo đặt lịch sau khi cài .msi (R-WIN-1)
        working-directory: apps/windows
        continue-on-error: true
        run: |
          $msi = (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path
          $log = Join-Path $env:RUNNER_TEMP 'msi.log'
          $i = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
          "msiexec /i thoát mã $($i.ExitCode)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'Lich va Van hoa Viet.lnk' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          "Lối tắt Start Menu: $($lnk.FullName)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          $proto = (Get-ItemProperty -Path 'HKCU:\Software\Classes\lichviet\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          "Giao thức lichviet: $proto" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          # Tự kiểm chạy bằng lvhv-ci-check.exe (cùng AppUserModelID với bản đã cài; không đóng gói — MA3C-25-01).
          $exe = (Resolve-Path target\release\lvhv-ci-check.exe).Path
          $o = Join-Path $env:RUNNER_TEMP 'toast-out.txt'; $e = Join-Path $env:RUNNER_TEMP 'toast-err.txt'
          $t = Start-Process -FilePath $exe -ArgumentList '--kiem-thong-bao' -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
          "--kiem-thong-bao thoát mã $($t.ExitCode)" | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          Get-Content $o, $e | Tee-Object -FilePath $env:RUNNER_TEMP\toast.txt -Append
          Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn' -Wait | Out-Null

      # R14 (04 Bổ sung B5): nâng cấp tại chỗ không mất dữ liệu. Cài bản đang phát hành (v0.1.4, tải từ GitHub Releases),
      # tạo dữ liệu (tệp "Để sau" đúng định dạng 0.1.4 ghi; sổ Người thân + ảnh + cài đặt), cài MSI mới đè lên (nâng cấp
      # lớn), chạy bản đã cài với --kiem-nang-cap (so từng phần với ảnh chụp kỳ vọng, đặt lại thông báo), rồi gỡ cài đặt và
      # kiểm thư mục dữ liệu còn nguyên từng byte. Kết quả ghi vào apps/windows/screenshots/nang-cap.txt. Chặn nếu KHÔNG ĐẠT.
      - name: R14 — nâng cấp tại chỗ giữ nguyên dữ liệu (0.1.4 → bản này, rồi gỡ cài đặt)
        working-directory: apps/windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'nang-cap.txt'
          $r = Join-Path $env:RUNNER_TEMP 'r14'
          New-Item -ItemType Directory -Force $r | Out-Null
          function Log($s) { Add-Content -Path $out -Value $s -Encoding utf8; Write-Host $s }
          function Fail($s) { Log "R14 Windows: KHÔNG ĐẠT — $s"; Write-Host "::error::R14: $s"; exit 1 }
          # Sản phẩm đang cài theo UpgradeCode (Windows Installer; MSI theo người dùng không nằm ở khóa Uninstall của HKCU).
          function Arp {
            $inst = New-Object -ComObject WindowsInstaller.Installer
            $list = $inst.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $inst, @('{6B1D2C5E-7A0F-4C8B-9E3D-2F4A6B8C1D01}'))
            $out = @()
            $n = $list.GetType().InvokeMember('Count', 'GetProperty', $null, $list, $null)
            for ($k = 0; $k -lt $n; $k++) { $code = $list.GetType().InvokeMember('Item', 'GetProperty', $null, $list, @($k)); $out += [pscustomobject]@{ Code = $code; Version = $inst.GetType().InvokeMember('ProductInfo', 'GetProperty', $null, $inst, @($code, 'VersionString')) } }
            return ,$out
          }
          function Msi($verb, $file, $tag) {
            $log = Join-Path $r "$tag.log"
            $p = Start-Process msiexec.exe -ArgumentList $verb, "`"$file`"", '/qn', '/l*v', "`"$log`"" -Wait -PassThru
            Log "msiexec $verb $tag ($(Split-Path $file -Leaf)): mã $($p.ExitCode)"
            if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content $log -Tail 40; Fail "msiexec $verb $tag thoát mã $($p.ExitCode)" }
          }
          function Run($exe, $argv, $tag) {
            $o = Join-Path $r "$tag.out"; $e = Join-Path $r "$tag.err"
            $p = Start-Process -FilePath $exe -ArgumentList $argv -Wait -PassThru -RedirectStandardOutput $o -RedirectStandardError $e
            Get-Content $o, $e | ForEach-Object { Log "  $_" }
            return $p.ExitCode
          }
          function Hashes($dir) { Get-ChildItem $dir -Recurse -File | Sort-Object FullName | ForEach-Object { "{0} {1}" -f $_.FullName.Substring($dir.Length), (Get-FileHash $_.FullName -Algorithm SHA256).Hash } }
          $data = Join-Path $env:LOCALAPPDATA 'ClevixLab\LichVanHoaViet'
          $flagDir = Join-Path $env:LOCALAPPDATA 'Clevix\LichVanHoaViet'
          $prog = Join-Path $env:LOCALAPPDATA 'Programs\LichVanHoaViet\LichViet.exe'
          # Công cụ kiểm của CI (không đóng gói, MA3C-25-01). Chuyển đổi dữ liệu và đặt lại thông báo do chính
          # LichViet.exe đã cài làm khi mở (Open-App); công cụ chỉ đọc và so kết quả.
          $chk = (Resolve-Path target\release\lvhv-ci-check.exe).Path
          function Open-App($tag) {
            $p = Start-Process -FilePath $prog -PassThru; Start-Sleep -Seconds 12
            if ($p.HasExited) { Fail "${tag}: LichViet.exe đã cài tự thoát (mã $($p.ExitCode))" }
            Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 2
            Log "${tag}: mở LichViet.exe đã cài 12 giây (mở kho, chuyển đổi nếu cần, đặt lại thông báo) rồi đóng"
          }
          Log "R14 Windows — $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC$((Get-Date).ToString('zzz')), bản mới $env:VERSION (run ${{ github.run_number }})"
          # Máy CI sạch: các bước trước chỉ dùng kho tạm. Có dữ liệu sẵn thì dừng chứ không xóa.
          if ((Test-Path $data) -or (Test-Path $flagDir)) { Fail "thư mục dữ liệu đã có trước khi thử" }
          if ((Arp).Count -ne 0) { Fail "còn bản cài từ bước trước" }

          # 1) Bản đang phát hành.
          gh release download v0.1.4 -R $env:GITHUB_REPOSITORY -p 'LichViet-0.1.4-x64.msi' -D $r --clobber
          if ($LASTEXITCODE -ne 0) { Fail "không tải được LichViet-0.1.4-x64.msi" }
          Msi '/i' (Join-Path $r 'LichViet-0.1.4-x64.msi') 'cai-0.1.4'
          $ov = (Get-Item $prog).VersionInfo.ProductVersion
          $old = Arp
          if ($old.Count -ne 1) { Fail "sau khi cài 0.1.4 thấy $($old.Count) sản phẩm" }
          Log "Sản phẩm 0.1.4: $($old[0].Code) $($old[0].Version)"
          Log "Đã cài bản cũ: LichViet.exe $ov"
          if (-not ($ov -like '0.1.4*')) { Fail "bản cũ có ProductVersion $ov" }
          # Bản 0.1.4 chạy được (8 giây) rồi tắt.
          $p = Start-Process -FilePath $prog -PassThru; Start-Sleep -Seconds 8
          if ($p.HasExited) { Fail "bản 0.1.4 tự thoát (mã $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force; Start-Sleep -Seconds 1

          # 2) Dữ liệu. "Để sau" (bản 0.1.4 chỉ lưu đúng tệp này; cỡ chữ và sáng/tối của bản Windows 0.1.4 không được lưu
          #    giữa các lần mở nên không có gì để giữ): đúng một dòng YYYY-MM-DD như update.rs của 0.1.4 ghi.
          New-Item -ItemType Directory -Force $flagDir | Out-Null
          $snooze = (Get-Date).ToUniversalTime().AddDays(30).ToString('yyyy-MM-dd')
          [IO.File]::WriteAllText((Join-Path $flagDir 'nhac-cap-nhat.txt'), $snooze)
          Log "Để sau (định dạng 0.1.4): $snooze"
          #    Sổ Người thân (hồ sơ, sự kiện, ảnh, cài đặt khác mặc định) tạo bằng bản dựng 0.2 này chạy từ .zip, chưa cài:
          #    bản 0.1.4 không có mô-đun này và chưa có bản 0.2 nào phát hành.
          Expand-Archive -Path "dist\LichViet-$env:VERSION-x64.zip" -DestinationPath (Join-Path $r 'zip') -Force
          $zexe = Join-Path $r 'zip\LichViet.exe'
          $snap = Join-Path $r 'anh-chup.json'
          if ((Run $chk @('--tao-du-lieu-mau', "`"$snap`"") 'tao') -ne 0) { Fail "--tao-du-lieu-mau lỗi" }

          # 3) Cài MSI mới đè lên (nâng cấp lớn; cùng số phiên bản cũng phải nâng cấp chứ không cài song song).
          Msi '/i' (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path 'cai-moi'
          $a = Arp
          Log "Sản phẩm đã cài (cùng UpgradeCode): $($a.Count) ($(($a | ForEach-Object { "$($_.Code) $($_.Version)" }) -join ', '))"
          if ($a.Count -ne 1) { Fail "có $($a.Count) bản cài sau khi nâng cấp" }
          if ($a[0].Code -eq $old[0].Code) { Fail "sản phẩm 0.1.4 chưa bị thay (nâng cấp lớn không chạy)" }
          if ((Get-FileHash $prog).Hash -ne (Get-FileHash $zexe).Hash) { Fail "LichViet.exe đã cài không phải bản mới" }
          Log "LichViet.exe đã cài là bản mới ($((Get-Item $prog).VersionInfo.FileVersion))"

          # 4) Tự kiểm: dữ liệu còn nguyên, đã chuyển lược đồ, thông báo được đặt lại.
          Open-App 'R14 (a)'
          if ((Run $chk @('--kiem-nang-cap', "`"$snap`"") 'kiem') -ne 0) { Fail "--kiem-nang-cap báo lỗi (xem trên)" }

          # 5) Gỡ cài đặt: chương trình mất, dữ liệu còn nguyên từng byte.
          $before = Hashes $data; $flagBefore = Get-Content (Join-Path $flagDir 'nhac-cap-nhat.txt') -Raw
          Msi '/x' (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path 'go'
          if ((Arp).Count -ne 0) { Fail "còn mục cài đặt sau khi gỡ" }
          if (Test-Path $prog) { Fail "LichViet.exe còn sau khi gỡ" }
          if (-not (Test-Path (Join-Path $data 'lvhv.sqlite'))) { Fail "gỡ cài đặt đã xóa sổ Người thân" }
          $after = Hashes $data
          if (Compare-Object $before $after) { Fail "thư mục dữ liệu đổi sau khi gỡ: $((Compare-Object $before $after | Out-String))" }
          if ((Get-Content (Join-Path $flagDir 'nhac-cap-nhat.txt') -Raw) -ne $flagBefore) { Fail "tệp Để sau đổi sau khi gỡ" }
          Log "Gỡ cài đặt: chương trình đã gỡ; thư mục dữ liệu còn nguyên ($($after.Count) tệp, SHA-256 khớp); tệp Để sau còn nguyên"
          Log "R14 (a) Windows: ĐẠT (0.1.4 → $env:VERSION bản dựng ${{ github.run_number }}; nâng cấp + gỡ cài đặt)"

          # 6) R14 (c): bộ mẫu đóng băng 0.2-dev-before-attachments (kho SQLite thật do bản dựng 0.2 trước YC-2026-07
          #    tạo, có certificate_photo_ids). Dữ liệu của ca (a) được dời sang bên cạnh (không xóa), chép kho của bộ mẫu
          #    vào thư mục dữ liệu, cài MSI mới, bản đã cài phải chuyển 1 → 2 đúng tệp kỳ vọng dùng chung với lõi và PWA.
          Log ""
          Rename-Item $data "$data.ca-a"
          $fix = (Resolve-Path ..\..\docs\v0.2\schema\test-vectors\released\0.2-dev-before-attachments).Path
          $exp = (Resolve-Path ..\..\docs\v0.2\schema\test-vectors\released\expected\0.2-dev-before-attachments.json).Path
          Copy-Item (Join-Path $fix 'store') $data -Recurse
          Log "R14 (c): chép kho của bộ mẫu $(Split-Path $fix -Leaf) vào thư mục dữ liệu ($((Get-ChildItem $data -Recurse -File).Count) tệp)"
          Msi '/i' (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path 'cai-moi-c'
          Open-App 'R14 (c)'
          if ((Run $chk @('--kiem-mau-dong-bang', "`"$exp`"") 'kiem-c') -ne 0) { Fail "R14 (c) --kiem-mau-dong-bang báo lỗi (xem trên)" }
          $before = Hashes $data
          Msi '/x' (Resolve-Path "dist\LichViet-$env:VERSION-x64.msi").Path 'go-c'
          if (Compare-Object $before (Hashes $data)) { Fail "R14 (c): thư mục dữ liệu đổi sau khi gỡ" }
          if (-not (Get-ChildItem $data -Filter 'lvhv.sqlite.pre-v*.bak')) { Fail "R14 (c): không có bản sao trước chuyển đổi" }
          Log "R14 (c) Windows: ĐẠT (gỡ cài đặt giữ nguyên $($before.Count) tệp, có bản sao trước chuyển đổi)"

          # 7) Ca lỗi: chuyển đổi lỗi thật trên bản chép của bộ mẫu (một hồ sơ hỏng) → chỉ đọc, kho cũ và bản sao giữ
          #    nguyên, từ chối ghi, vẫn xuất được sao lưu. Chạy bằng lvhv-ci-check.exe trên bản chép trong thư mục tạm.
          Log ""
          if ((Run $chk @('--kiem-chi-doc', "`"$(Join-Path $fix 'store')`"") 'kiem-loi') -ne 0) { Fail "R14 ca lỗi --kiem-chi-doc báo lỗi (xem trên)" }
          Log "R14 Windows: ĐẠT — (a) 0.1.4 → bản này, (c) bộ mẫu đóng băng, ca lỗi chỉ đọc"

      # MA3C-25-01: LichViet.exe phát hành (bản trong .zip, cũng là bản trong .msi — so băm ở bước R14) không chứa chế độ
      # kiểm thử nào: không có chuỗi cờ của CI, và chạy với một cờ thì chỉ mở giao diện như thường (không tạo tệp).
      # .zip và .msi không chứa lvhv-ci-check.exe.
      - name: Kiểm tra — LichViet.exe phát hành không có chế độ kiểm thử
        working-directory: apps/windows
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'kiem-phat-hanh'
          Expand-Archive -Path "dist\LichViet-$env:VERSION-x64.zip" -DestinationPath $d -Force
          $names = (Get-ChildItem $d -Recurse -File).Name -join ', '
          Write-Host "Tệp trong .zip: $names"
          if (Get-ChildItem $d -Recurse -Filter 'lvhv-ci-check*') { Write-Host "::error::.zip chứa lvhv-ci-check"; exit 1 }
          $exe = Join-Path $d 'LichViet.exe'
          $bytes = [IO.File]::ReadAllBytes($exe)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $flags = '--chup-man-hinh','--do-bo-nho','--kiem-thong-bao','--tao-du-lieu-mau','--kiem-nang-cap','--kiem-mau-dong-bang','--kiem-chi-doc'
          $found = $flags | Where-Object { $text.Contains($_) }
          if ($found) { Write-Host "::error::LichViet.exe phát hành còn chuỗi cờ: $($found -join ', ')"; exit 1 }
          $ci = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes((Resolve-Path target\release\lvhv-ci-check.exe).Path))
          $missing = $flags | Where-Object { -not $ci.Contains($_) }
          if ($missing) { Write-Host "::error::phép tìm chuỗi không đáng tin: lvhv-ci-check.exe thiếu $($missing -join ', ')"; exit 1 }
          # Chạy thử: cờ bị bỏ qua — không tạo tệp ảnh chụp, không tạo thư mục dữ liệu, giao diện mở như thường.
          $snap = Join-Path $env:RUNNER_TEMP 'khong-duoc-tao.json'
          $data = Join-Path $env:LOCALAPPDATA 'ClevixLab\LichVanHoaViet'
          $hadData = Test-Path $data
          $p = Start-Process -FilePath $exe -ArgumentList '--tao-du-lieu-mau', "`"$snap`"" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Host "::error::LichViet.exe --tao-du-lieu-mau thoát (mã $($p.ExitCode)) — có vẻ vẫn hiểu cờ"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (Test-Path $snap) { Write-Host "::error::LichViet.exe phát hành vẫn tạo dữ liệu mẫu"; exit 1 }
          if (-not $hadData -and (Test-Path (Join-Path $data 'lvhv.sqlite'))) { Write-Host "::error::LichViet.exe phát hành đã tạo kho"; exit 1 }
          Write-Host "Đạt: không có chuỗi cờ CI ($($flags.Count) cờ), không tạo tệp khi được truyền cờ, .zip chỉ có: $names"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            apps/windows/dist/*.zip
            apps/windows/dist/*.msi
            ${{ runner.temp }}/mem.txt
            ${{ runner.temp }}/toast.txt
            ${{ runner.temp }}/nang-cap.txt
          retention-days: 30

      # Tải tạo phẩm bị chặn trong môi trường duyệt, nên ảnh chụp (và số đo bộ nhớ, kết quả thử thông báo) được
      # commit vào chính nhánh của PR (apps/windows/screenshots/). Chỉ với PR từ nhánh trong kho; commit có
      # "[skip ci]" để không chạy lại. CHỈ nhánh của nhóm Windows (tên nhánh có "windows"): không bao giờ đẩy commit lên
      # nhánh PR của nhóm khác (PWA, Apple, Android, lõi).
      - name: Commit ảnh chụp vào nhánh của PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.head_ref, 'windows')
        continue-on-error: true
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $wt = Join-Path $env:RUNNER_TEMP 'shots-wt'
          git fetch --depth=1 origin "$env:HEAD_REF"
          git worktree add --detach $wt FETCH_HEAD
          $dst = Join-Path $wt 'apps\windows\screenshots'
          if (Test-Path $dst) { Remove-Item $dst -Recurse -Force }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'screens\*.png') $dst
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'mem.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'mem.txt') (Join-Path $dst 'bo-nho.txt') }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'toast.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'toast.txt') (Join-Path $dst 'thong-bao.txt') }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'nang-cap.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'nang-cap.txt') (Join-Path $dst 'nang-cap.txt') }
          git -C $wt add -A apps/windows/screenshots
          git -C $wt diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "Ảnh không đổi"; exit 0 }
          git -C $wt commit -q -m "Ảnh chụp Windows từ CI (run ${{ github.run_number }}) [skip ci]"
          git -C $wt push origin "HEAD:refs/heads/$env:HEAD_REF"

      # Chỉ khi đẩy thẻ phiên bản (v*): tạo bản phát hành (pre-release) trên GitHub và đính kèm .msi/.zip.
      - name: Đăng lên GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref }}" -like "refs/tags/v*") { "${{ github.ref_name }}" } else { "v" + (Get-Content VERSION -Raw).Trim() }
          $repo = "${{ github.repository }}"
          $notes = @"
          Bản thử nghiệm Lịch và Văn hóa Việt $tag cho Windows 10/11 (64-bit).

          - **LichViet-*-x64.msi**: bộ cài, bấm đúp để cài.
          - **LichViet-*-x64.zip**: bản chạy không cần cài, giải nén rồi mở LichViet.exe.

          Bản này **chưa được ký số**, nên Windows có thể hiện "Windows protected your PC". Bấm **More info → Run anyway** để chạy.
          Ứng dụng không kết nối mạng và không thu thập dữ liệu. Thay đổi: xem CHANGELOG.md.
          "@
          $notes = ($notes -split "`n" | ForEach-Object { $_ -replace '^\s{10}', '' }) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release view $tag -R $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $repo --target "${{ github.sha }}" --prerelease --title "Lịch và Văn hóa Việt $tag" --notes-file release-notes.md
          }
          gh release upload $tag -R $repo --clobber (Get-ChildItem apps/windows/dist/*.msi).FullName (Get-ChildItem apps/windows/dist/*.zip).FullName
