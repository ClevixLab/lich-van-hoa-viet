# Đăng PWA (pwa/dist) lên GitHub Pages khi đẩy thẻ phiên bản v*.
# Cần bật một lần: Settings > Pages > Source = "GitHub Actions".
name: pwa-pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: Dựng PWA
        working-directory: pwa
        run: |
          npm ci
          npm run build      # sinh src/gen/ trước, typecheck cần các tệp này
          npm run typecheck
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
