# Android: dựng thư viện Rust (cargo-ndk) + APK/AAB release (R8). Không có khóa → bản không ký;
# có đủ 4 secret LVHV_ANDROID_* → bản ký bằng khóa tải lên (upload key). Xem docs/04-BUILD-NATIVE.md.
# Đăng bản phát hành (job `publish`): thẻ v* hoặc chạy tay với publish_release = true trên main; chỉ bản đã ký.
# Tạo khóa và đặt 4 secret: scripts/tao-khoa-ky-android.ps1 (máy Windows của chủ dự án).
name: android

# Chỉ chạy khi mã hay dữ liệu mà bản Android dùng thay đổi (đường lọc không áp cho thẻ v*: thẻ luôn dựng).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/android/**"
      - "core/**"
      - "ngochap/**"
      - "store/**"
      - "backup/**"
      - "ffi/**"
      - "memorial/**"
      - "content/memorial/trays/**"
      - "scripts/check-tray-pack.py"
      - "docs/v0.2/schema/test-vectors/released/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "core/**"
      - "ngochap/**"
      - "store/**"
      - "backup/**"
      - "ffi/**"
      - "memorial/**"
      - "content/memorial/trays/**"
      - "scripts/check-tray-pack.py"
      - "docs/v0.2/schema/test-vectors/released/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "VERSION"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Đăng APK + AAB đã ký lên GitHub Releases v<VERSION> (chỉ từ main; cần 4 secret LVHV_ANDROID_*)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # Chỉ hủy run cũ của PR; mỗi commit trên main/thẻ đều được dựng trọn (push dồn dập không làm mất kết quả).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Phiên bản ghim (đều là bản ổn định đã phát hành trước 2025):
  GRADLE_VERSION: "8.11.1"
  NDK_VERSION: "r27c"          # 27.2.12479018
  CARGO_NDK_VERSION: "3.5.4"
  JAVA_VERSION: "17"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signed.outputs.signed }}
      cert_sha256: ${{ steps.signed.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android

      - name: Cài cargo-ndk ${{ env.CARGO_NDK_VERSION }}
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - name: Dựng Rust (.so cho 3 ABI) + sinh mã Kotlin UniFFI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          apps/android/build-rust.sh
          find apps/android/app/rustJniLibs apps/android/app/build/generated -type f | sort

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Giải mã khóa ký (nếu có secret)
        id: sign
        env:
          KS_B64: ${{ secrets.LVHV_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
            echo "Có khóa: bản release sẽ được ký."
          else
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "Không có secret LVHV_ANDROID_KEYSTORE_BASE64: bản release KHÔNG ký (chỉ để kiểm tra dựng)."
          fi

      - name: Gradle — lint, unit test, assembleRelease, bundleRelease
        working-directory: apps/android
        env:
          LVHV_KEYSTORE_FILE: ${{ steps.sign.outputs.file }}
          LVHV_KEYSTORE_PASSWORD: ${{ secrets.LVHV_ANDROID_KEYSTORE_PASSWORD }}
          LVHV_KEY_ALIAS: ${{ secrets.LVHV_ANDROID_KEY_ALIAS }}
          LVHV_KEY_PASSWORD: ${{ secrets.LVHV_ANDROID_KEY_PASSWORD }}
          LVHV_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          export LVHV_BUILD_DATE="$(date -u +%Y-%m-%d)"
          # Kiểm thử JVM (logic + giao diện Robolectric) chạy trên biến thể debug (cần ui-test-manifest) và gọi lõi Rust
          # bản máy tính (target/release/liblvhv_ffi.so, build-rust.sh đã dựng).
          # testReleaseUnitTest: kiểm thử logic (chuỗi báo thức, dữ liệu) trên biến thể release, trừ kiểm thử giao diện.
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease

      - name: Kiểm tra — quyền đúng danh sách cho phép (S6), không INTERNET; có đủ 3 ABI
        working-directory: apps/android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | sort | head -1)
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          "$AAPT2" dump permissions "$APK" | tee "$RUNNER_TEMP/perms.txt"
          # S6 (docs/v0.2/04), O-6 (báo thức không chính xác → KHÔNG có SCHEDULE_EXACT_ALARM): đúng và chỉ
          #   - POST_NOTIFICATIONS: thông báo nhắc ngày giỗ / sinh nhật;
          #   - RECEIVE_BOOT_COMPLETED: đặt lại chuỗi báo thức sau khi khởi động lại;
          #   - <app>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION: quyền mức "signature" do androidx.core (≥ 1.9) tự
          #     thêm để bảo vệ receiver nội bộ; không cấp truy cập hệ thống/mạng nào, người dùng không thấy.
          printf '%s\n' \
            "uses-permission: name='android.permission.POST_NOTIFICATIONS'" \
            "uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'" \
            "uses-permission: name='vn.clevix.lichviet.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" \
            | sort > "$RUNNER_TEMP/allowed.txt"
          grep "^uses-permission" "$RUNNER_TEMP/perms.txt" | sed 's/ maxSdkVersion=.*//' | sort -u > "$RUNNER_TEMP/actual.txt"
          if ! diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"; then
            echo "::error::Danh sách quyền của APK khác danh sách cho phép S6 (xem diff ở trên)."; exit 1
          fi
          if grep -qi "INTERNET" "$RUNNER_TEMP/perms.txt"; then echo "::error::APK có quyền INTERNET."; exit 1; fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$APK" | grep -q "lib/$abi/liblvhv_ffi.so" || { echo "::error::Thiếu lib/$abi/liblvhv_ffi.so"; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libjnidispatch.so" || { echo "::error::Thiếu lib/$abi/libjnidispatch.so (JNA)"; exit 1; }
          done
          ls -la app/build/outputs/apk/release app/build/outputs/bundle/release

      - name: Kiểm tra — S5 (allowBackup=false, có quy tắc trích xuất) trong manifest đã gộp
        working-directory: apps/android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | sort | head -1)
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"
          grep -E 'allowBackup.*=false' "$RUNNER_TEMP/manifest.txt" || { echo "::error::allowBackup phải là false (S5)"; exit 1; }
          grep -q 'dataExtractionRules' "$RUNNER_TEMP/manifest.txt" || { echo "::error::Thiếu dataExtractionRules (S5)"; exit 1; }
          # BM2-18: SelfCheckActivity (R14, exported, chỉ ở src/debug) không bao giờ có trong APK release.
          if grep -q 'SelfCheck' "$RUNNER_TEMP/manifest.txt"; then echo "::error::APK release có SelfCheckActivity (chỉ được ở debug)"; exit 1; fi
          # Thành phần exported: chỉ MainActivity (LAUNCHER), hoặc thành phần thư viện được bảo vệ bằng quyền hệ thống
          # (androidx.profileinstaller.ProfileInstallReceiver: android.permission.DUMP — chỉ adb/hệ thống gửi được).
          python3 - "$RUNNER_TEMP/manifest.txt" <<'PY'
          import re, sys
          comps, cur = [], None
          for line in open(sys.argv[1], encoding="utf-8"):
              m = re.match(r"\s*E: (activity|activity-alias|receiver|service|provider) ", line)
              if m:
                  cur = {"kind": m.group(1)}; comps.append(cur); continue
              if re.match(r"\s*E: ", line) and cur is not None and re.match(r"\s*E: (intent-filter|action|category|data|meta-data)", line) is None:
                  cur = None
              if cur is None: continue
              for key in ("name", "permission", "exported"):
                  m = re.search(r":%s\(0x[0-9a-f]+\)=(?:\"([^\"]*)\"|(\S+))" % key, line)
                  if m and key not in cur: cur[key] = m.group(1) or m.group(2)
          ok_perm = {"android.permission.DUMP"}
          bad = [c for c in comps if c.get("exported") == "true"
                 and c.get("name") != "vn.clevix.lichviet.MainActivity" and c.get("permission") not in ok_perm]
          for c in comps:
              if c.get("exported") == "true": print("exported:", c)
          if bad:
              print("::error::Thành phần exported không được phép:", bad); sys.exit(1)
          PY

      - name: Quét lỗ hổng phụ thuộc Gradle (S11, BM2-09) — osv-scanner trên tệp khóa
        working-directory: apps/android
        env:
          OSV_VERSION: "2.3.8"
          # SHA-256 ghim cứng (osv-scanner_SHA256SUMS của bản v2.3.8), không tin tệp tổng kiểm tải cùng nguồn.
          OSV_SHA256: "bc98e15319ed0d515e3f9235287ba53cdc5535d576d24fd573978ecfe9ab92dc"
        run: |
          # Tệp khóa sinh từ đồ thị phụ thuộc đã phân giải (dependencyLocking trong app/build.gradle.kts).
          gradle --no-daemon -q :app:dependencies --write-locks > /dev/null
          test -s app/gradle.lockfile || { echo "::error::Không sinh được app/gradle.lockfile"; exit 1; }
          wc -l app/gradle.lockfile
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"
          # (1) Phụ thuộc đi vào APK (releaseRuntimeClasspath): lỗ hổng đã biết → CI đỏ.
          { grep '^#' app/gradle.lockfile; grep -E '^[^#].*=(.*,)?releaseRuntimeClasspath(,|$)' app/gradle.lockfile; echo 'empty='; } > "$RUNNER_TEMP/gradle.lockfile"
          echo "Phụ thuộc trong APK release: $(grep -c '^[^#e]' "$RUNNER_TEMP/gradle.lockfile")"
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile "gradle.lockfile:$RUNNER_TEMP/gradle.lockfile"
          # (2) Công cụ dựng và kiểm thử (lint, AGP, Robolectric, Roborazzi…): không vào APK, chỉ chạy trên máy dựng —
          # báo cáo để theo dõi, không làm CI đỏ. In cấu hình chứa từng gói bị ảnh hưởng.
          "$RUNNER_TEMP/osv-scanner" scan source --format markdown --lockfile "gradle.lockfile:app/gradle.lockfile" > "$RUNNER_TEMP/osv-all.md" || true
          { echo "### osv-scanner: công cụ dựng/kiểm thử Android (không vào APK)"; cat "$RUNNER_TEMP/osv-all.md"; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(io\.netty:netty-handler|org\.bouncycastle:bcprov|com\.google\.guava:guava|com\.google\.protobuf:protobuf-java|commons-io:commons-io):' app/gradle.lockfile | cut -c1-400 || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-gradle-lockfile
          path: apps/android/app/gradle.lockfile
          retention-days: 14

      - name: Kiểm tra — versionName/versionCode của APK khớp tệp VERSION
        working-directory: apps/android
        run: |
          V="$(tr -d '[:space:]' < ../../VERSION)"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$((MA * 10000 + MI * 100 + PA))
          APK=$(find app/build/outputs/apk/release -name "*.apk" | sort | head -1)
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -qF "versionName='$V'" || { echo "::error::versionName của APK khác VERSION ($V)"; exit 1; }
          echo "$BADGING" | grep -qF "versionCode='$CODE'" || { echo "::error::versionCode của APK khác $CODE (tính từ VERSION $V)"; exit 1; }

      - name: Xóa tệp khóa tạm
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # Bản release có được ký không (job `publish` chỉ đăng bản đã ký). APK: apksigner verify; AAB: chữ ký JAR, cùng
      # chứng chỉ với APK. Dấu vân tay SHA-256 của chứng chỉ ghi vào tóm tắt run để chủ dự án so với dấu vân tay mà
      # scripts/tao-khoa-ky-android.ps1 in ra lúc tạo khóa.
      - name: Kiểm tra — bản release đã ký chưa
        id: signed
        working-directory: apps/android
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | sort | head -1)
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | sort | head -1)
          echo "APK: $APK"; echo "AAB: $AAB"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt" 2>&1; then
            cat "$RUNNER_TEMP/apk-certs.txt"
            APK_SHA=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" | tr -d ':[:space:]' | tr 'A-F' 'a-f')
            AAB_SHA=$(keytool -printcert -jarfile "$AAB" 2>/dev/null | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
            echo "Chứng chỉ APK: $APK_SHA"; echo "Chứng chỉ AAB: $AAB_SHA"
            if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$AAB_SHA" ]; then
              echo "::error::APK đã ký nhưng AAB không cùng chứng chỉ (APK: '$APK_SHA', AAB: '$AAB_SHA')."; exit 1
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=$APK_SHA" >> "$GITHUB_OUTPUT"
            { echo "### Android: bản release ĐÃ KÝ"; echo; echo "Chứng chỉ SHA-256: \`$APK_SHA\`"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "cert_sha256=" >> "$GITHUB_OUTPUT"
            echo "Bản release KHÔNG ký ($(basename "$APK")) — không cài được trên điện thoại, không đăng phát hành."
            { echo "### Android: bản release CHƯA KÝ"; echo; echo "Chưa có 4 secret LVHV_ANDROID_* — xem scripts/tao-khoa-ky-android.ps1."; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/outputs/bundle/release/*.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint-report
          path: apps/android/app/build/reports/
          retention-days: 14

  # Giao diện: kiểm thử Robolectric + ảnh chụp màn hình (Roborazzi) với lõi Rust bản máy tính — không cần NDK.
  # Trên PR từ chính kho này, ảnh được commit ngược vào nhánh của PR (apps/android/screenshots/and-*.png) vì
  # tạo phẩm (artifact) không tải được ở nơi duyệt. Commit bằng GITHUB_TOKEN không kích hoạt lại CI.
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Chỉ đọc: job này chạy mã của PR (Gradle). Việc commit ảnh nằm ở job "screenshots" không chạy mã của PR.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-host

      - name: Dựng lõi Rust bản máy tính + sinh mã Kotlin UniFFI
        run: |
          cargo build -p lvhv-ffi --lib --release
          cargo build -p lvhv-ffi --features bindgen-cli --bin uniffi-bindgen
          OUT=apps/android/app/build/generated/uniffi/kotlin
          rm -rf "$OUT" && mkdir -p "$OUT"
          target/debug/uniffi-bindgen generate --library target/release/liblvhv_ffi.so \
            --language kotlin --out-dir "$OUT" --config ffi/uniffi.toml --no-format
          test -s "$OUT/vn/clevix/lichviet/core/lvhv_ffi.kt"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Kiểm thử JVM + ảnh chụp màn hình
        id: tests
        continue-on-error: true
        working-directory: apps/android
        run: |
          rm -f screenshots/and-*.png
          gradle --no-daemon --stacktrace -Plvhv.hostOnly=true :app:testDebugUnitTest
          ls -la screenshots

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-screenshots
          path: apps/android/screenshots/and-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Kết quả kiểm thử
        if: steps.tests.outcome != 'success'
        run: |
          echo "::error::Kiểm thử JVM / giao diện không đạt (xem bước 'Kiểm thử JVM + ảnh chụp màn hình')."
          exit 1

  # Commit ảnh vào nhánh PR (MA3N-24-08): có quyền ghi nhưng KHÔNG chạy mã của PR — chỉ lấy tệp PNG từ artifact.
  screenshots:
    needs: ui
    # Chỉ commit ảnh vào nhánh PR của Android (tên nhánh có "android"); PR khác chạy workflow này (sửa lõi…) thì không ghi.
    # Chỉ khi job `ui` thành công trọn vẹn (mọi kiểm thử chạy xong → bộ ảnh đủ) và run không bị hủy: run bị hủy hay kiểm thử
    # lỗi giữa chừng chỉ có một phần ảnh, không được ghi đè lên nhánh.
    if: ${{ !cancelled() && needs.ui.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.head_ref, 'android') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-screenshots
          path: ${{ runner.temp }}/shots
      - name: Commit ảnh chụp vào nhánh PR
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/shots/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "Không có ảnh."; exit 0; fi
          # Chỉ thêm/ghi đè ảnh vừa sinh lại; KHÔNG xóa ảnh nào (ảnh của ca kiểm thử đã bỏ thì xóa bằng tay trong PR).
          for f in "${files[@]}"; do
            case "$(basename "$f")" in and-*.png) cp -- "$f" apps/android/screenshots/ ;; esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/android/screenshots
          if git diff --cached --quiet; then echo "Ảnh không đổi."; exit 0; fi
          git commit -m "Android: ảnh chụp màn hình mô-đun Người thân (CI, run ${{ github.run_number }})"
          git pull --rebase origin "${{ github.head_ref }}" || true
          git push origin "HEAD:${{ github.head_ref }}"

  # R14 (docs/v0.2/04 Bổ sung B5): nâng cấp tại chỗ không mất dữ liệu, trên trình giả lập. Cài bản cũ (v0.1.4 = d9650c7 và
  # 0.2-dev từ main), tạo dữ liệu, `adb install -r` bản mới, kiểm dữ liệu còn nguyên và chuỗi báo thức được đặt lại.
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: android-upgrade

      - name: Cài cargo-ndk ${{ env.CARGO_NDK_VERSION }}
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Dựng APK debug — bản cũ v0.1.4 (d9650c7), 0.2-dev (main) và bản mới (PR)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apk"; mkdir -p "$OUT"
          git worktree add "$RUNNER_TEMP/v014" d9650c7
          git worktree add "$RUNNER_TEMP/main" origin/main
          apps/android/ci/build-debug-apk.sh "$RUNNER_TEMP/v014" "$OUT/old-v0.1.4.apk"
          apps/android/ci/build-debug-apk.sh "$RUNNER_TEMP/main" "$OUT/old-main.apk"
          apps/android/ci/build-debug-apk.sh "$GITHUB_WORKSPACE" "$OUT/new.apk"
          ls -la "$OUT"

      - name: Bật KVM cho trình giả lập
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: R14 — cài đè trên trình giả lập (API 34)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: apps/android/ci/upgrade-test.sh "$RUNNER_TEMP/apk/new.apk" "$RUNNER_TEMP/apk/old-v0.1.4.apk" "$RUNNER_TEMP/apk/old-main.apk"

  # Đăng bản phát hành: thẻ v* hoặc chạy tay (workflow_dispatch, publish_release = true) trên main. Chỉ sau khi dựng,
  # kiểm thử giao diện và R14 trên trình giả lập đều đạt; chỉ đăng bản ĐÃ KÝ (bản không ký không cài được trên điện
  # thoại) — chưa có khóa thì job đỏ với hướng dẫn. Không chạy mã của nhánh: chỉ lấy tạo phẩm `android-release` và
  # CHANGELOG.md, VERSION.
  publish:
    needs: [build, ui, upgrade]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.ui.result == 'success' && needs.upgrade.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            VERSION
            CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Điều kiện đăng — bản đã ký, đúng nhánh/thẻ
        env:
          SIGNED: ${{ needs.build.outputs.signed }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Bản release Android CHƯA KÝ nên không đăng: tệp APK không ký không cài được trên điện thoại. Cần đủ 4 secret của kho: LVHV_ANDROID_KEYSTORE_BASE64, LVHV_ANDROID_KEYSTORE_PASSWORD, LVHV_ANDROID_KEY_ALIAS, LVHV_ANDROID_KEY_PASSWORD. Chủ dự án tạo khóa và đặt secret bằng scripts/tao-khoa-ky-android.ps1 (Windows PowerShell), rồi chạy lại workflow này."
            exit 1
          fi
          case "$REF" in
            refs/tags/v*) [ "$REF_NAME" = "v$V" ] || { echo "::error::Thẻ $REF_NAME khác VERSION ($V): thẻ phải là v$V."; exit 1; } ;;
            refs/heads/main) ;;
            *) echo "::error::Chỉ đăng bản phát hành từ main hoặc thẻ v*, không từ $REF."; exit 1 ;;
          esac
          echo "Đăng v$V, chứng chỉ SHA-256 ${{ needs.build.outputs.cert_sha256 }}"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release
          path: ${{ runner.temp }}/rel

      - name: Đăng lên GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CERT: ${{ needs.build.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          V="$(tr -d '[:space:]' < VERSION)"
          TAG="v$V"
          OUT="$RUNNER_TEMP/dang"; mkdir -p "$OUT"
          APK=$(find "$RUNNER_TEMP/rel" -path '*apk/release/*.apk' | sort | head -1)
          AAB=$(find "$RUNNER_TEMP/rel" -path '*bundle/release/*.aab' | sort | head -1)
          case "$APK" in *-unsigned.apk|"") echo "::error::Không có APK đã ký trong tạo phẩm ($APK)."; exit 1 ;; esac
          [ -n "$AAB" ] || { echo "::error::Không có AAB trong tạo phẩm."; exit 1; }
          cp "$APK" "$OUT/LichViet-$V.apk"
          cp "$AAB" "$OUT/LichViet-$V.aab"
          (cd "$OUT" && sha256sum "LichViet-$V.apk" "LichViet-$V.aab" > "LichViet-$V-android-SHA256SUMS.txt")
          cat "$OUT/LichViet-$V-android-SHA256SUMS.txt"
          # Ghi chú: mục "## [<VERSION>]" của CHANGELOG.md.
          awk -v want="$V" '
            /^## \[/ { v = $2; gsub(/[\[\]]/, "", v); on = (v == want) }
            on { print }
          ' CHANGELOG.md > "$OUT/changelog.md"
          grep -q '^- ' "$OUT/changelog.md" || { echo "::error::CHANGELOG.md không có mục [$V] (hoặc mục rỗng)."; exit 1; }
          {
            echo "Bản thử nghiệm Lịch và Văn hóa Việt $TAG cho Android 8.0 trở lên, có mục Người thân như bản web"
            echo "(ngày giỗ âm lịch, sinh nhật, nhắc trước, màn hình tưởng niệm, sao lưu ra tệp có mật khẩu)."
            echo
            echo "- **LichViet-$V.apk**: tệp cài trên điện thoại. Tải về, mở tệp, cho phép \"Cài ứng dụng không rõ nguồn gốc\" khi máy hỏi."
            echo "- **LichViet-$V.aab**: gói dành cho cửa hàng ứng dụng, không cài trực tiếp được."
            echo "- **LichViet-$V-android-SHA256SUMS.txt**: mã kiểm tra tệp."
            echo
            echo "Chứng chỉ ký (SHA-256): \`$CERT\`. Các bản cập nhật sau dùng cùng chứng chỉ này nên cài đè được, dữ liệu giữ nguyên."
            echo "Ứng dụng không kết nối mạng và không thu thập dữ liệu."
            echo
            cat "$OUT/changelog.md"
          } > "$OUT/release-notes.md"
          cat "$OUT/release-notes.md"
          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --target "$SHA" --prerelease --title "Lịch và Văn hóa Việt $TAG" --notes-file "$OUT/release-notes.md" \
              || gh release view "$TAG" -R "$REPO" > /dev/null   # workflow khác vừa tạo cùng lúc (thẻ v*)
          else
            echo "Đã có bản phát hành $TAG (ví dụ do Windows tạo): chỉ thêm tệp Android, không sửa ghi chú."
          fi
          gh release upload "$TAG" -R "$REPO" --clobber "$OUT/LichViet-$V.apk" "$OUT/LichViet-$V.aab" "$OUT/LichViet-$V-android-SHA256SUMS.txt"
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '.url, (.assets[].name)'
