# Gradle được ghim ở 8.11.1. Tệp gradle-wrapper.jar KHÔNG có trong kho (không tải được trong
# môi trường soạn mã). CI dùng gradle/actions/setup-gradle với gradle-version 8.11.1.
# Muốn có ./gradlew trên máy: cài Gradle 8.11.1 rồi chạy `gradle wrapper --gradle-version 8.11.1`
# trong thư mục apps/android (lệnh sẽ sinh gradlew, gradlew.bat và gradle-wrapper.jar).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
