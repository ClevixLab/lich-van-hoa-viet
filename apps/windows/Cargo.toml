[package]
name = "lvhv-windows"
version = "0.1.0"
edition = "2021"
description = "Lịch và Văn hóa Việt — ứng dụng Windows (Slint), Clevix Lab"
license = "MIT"
publish = false
authors = ["Clevix LLC (Clevix Lab)"]
homepage = "https://clevix.vn"
build = "build.rs"

[[bin]]
name = "LichViet"
path = "src/main.rs"

[dependencies]
lvhv-ffi = { path = "../../ffi" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Slint 1.8.0 (đã kiểm tra dựng được trên Linux trong môi trường soạn mã).
# Giấy phép Slint: GPL-3.0 HOẶC "Royalty-free 2.0" (miễn phí cho ứng dụng desktop, cần hiển thị
# ghi công "Made with Slint" — xem màn hình Giới thiệu) HOẶC thương mại. Xem docs/04-BUILD-NATIVE.md.
slint = { version = "=1.8.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-femtovg", "renderer-software"] }

[build-dependencies]
slint-build = "=1.8.0"
winresource = "=0.1.19"

[package.metadata.wix]
upgrade-guid = "6B1D2C5E-7A0F-4C8B-9E3D-2F4A6B8C1D01"
path-guid = "6B1D2C5E-7A0F-4C8B-9E3D-2F4A6B8C1D02"
license = false
eula = false

# Workspace riêng: crate này kéo nhiều thư viện (Slint, winit, femtovg). Giữ ngoài workspace gốc để
# `cargo test` của lõi không phải dựng giao diện. Xem docs/04-BUILD-NATIVE.md.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
