[package]
name = "lvhv-windows"
version = "0.2.0" # PHẢI bằng tệp VERSION ở gốc kho — build.rs dừng dựng nếu khác
edition = "2021"
description = "Lịch và Văn hóa Việt — ứng dụng Windows (Slint), Clevix Lab"
license = "MIT"
publish = false
authors = ["Clevix LLC (Clevix Lab)"]
homepage = "https://clevix.vn"
build = "build.rs"

[lib]
name = "lvhv_windows"
path = "src/app.rs"

# Bản phát hành (đóng gói vào .msi/.zip).
[[bin]]
name = "LichViet"
path = "src/main.rs"

# Chỉ dùng trong CI, không đóng gói (MA3C-25-01).
[[bin]]
name = "lvhv-ci-check"
path = "src/bin/lvhv-ci-check.rs"

[dependencies]
lvhv-ffi = { path = "../../ffi" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
# Slint 1.8.0 (đã kiểm tra dựng được trên Linux trong môi trường soạn mã).
# Giấy phép Slint: GPL-3.0 HOẶC "Royalty-free 2.0" (miễn phí cho ứng dụng desktop, cần hiển thị
# ghi công "Made with Slint" — xem màn hình Giới thiệu) HOẶC thương mại. Xem docs/04-BUILD-NATIVE.md.
#
# Renderer: Skia (trên Windows vẽ bằng Direct3D 12, tự lùi về Skia phần mềm nếu máy không có D3D12).
# Skia dựng chữ bằng HarfBuzz + làm mịn chữ như trình duyệt, nên chữ Việt có dấu (ệ, ữ, ỡ, Ậ) đặt dấu
# đúng và sắc nét ở mọi tỉ lệ màn hình 100–300%. Bản 0.1.2 dùng FemtoVG (OpenGL) — chữ mảnh, nhòe ở
# tỉ lệ 125/150%. "renderer-software" giữ làm phương án cuối khi Skia không khởi tạo được.
# Skia tải thư viện dựng sẵn (skia-binaries, GitHub Releases) lúc biên dịch.
slint = { version = "=1.8.0", default-features = false, features = ["std", "compat-1-2", "accessibility", "backend-winit", "renderer-skia", "renderer-software", "raw-window-handle-06"] }
# Ghi ảnh PNG cho chế độ chụp màn hình (--chup-man-hinh); đã có sẵn trong cây phụ thuộc của Slint.
png = "0.17.16"
# Ảnh chân dung / giấy báo tử (01 §3.8, S9): giải mã rồi mã hóa lại JPEG để bỏ EXIF/GPS/XMP/IPTC. Cùng bản
# 0.24.9 đã có trong cây phụ thuộc của Slint (không thêm thư viện mới).
# R14: băm ảnh và đọc phiên bản lược đồ khi tự kiểm sau nâng cấp (cùng phiên bản với lvhv-store).
sha2 = "=0.11.1"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
image = { version = "=0.24.9", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

# Thông báo Windows đặt lịch trước (WinRT ToastNotificationManager), hộp chọn tệp (comdlg32), múi giờ, định danh
# ứng dụng (AUMID). Cùng bản 0.58.0 đã có trong cây phụ thuộc (accesskit_windows, skia-safe).
[target.'cfg(windows)'.dependencies]
# HWND của cửa sổ chính để hộp chọn tệp là hộp thoại con (cùng bản 0.6.2 đã có trong cây phụ thuộc của winit).
raw-window-handle = "=0.6.2"
windows = { version = "=0.58.0", features = [
    "Foundation",
    "Foundation_Collections",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_Controls_Dialogs",
] }

[dev-dependencies]
# Backend kiểm thử của Slint: dựng cửa sổ ảo, bấm chuột giả lập để kiểm tra các nút (src/ui_tests.rs).
i-slint-backend-testing = "=1.8.0"
# R14: ca `force_migration_failure` của lõi trên bộ mẫu đóng băng (chỉ kiểm thử).
lvhv-store = { path = "../../store" }

[build-dependencies]
slint-build = "=1.8.0"
winresource = "=0.1.19"
# Gói ảnh mâm lễ (08 §16.3): đọc manifest và kiểm sha256 lúc dựng.
serde_json = "1.0.145"
sha2 = "=0.11.1"

[package.metadata.wix]
upgrade-guid = "6B1D2C5E-7A0F-4C8B-9E3D-2F4A6B8C1D01"
path-guid = "6B1D2C5E-7A0F-4C8B-9E3D-2F4A6B8C1D02"
license = false
eula = false

# Mã sản phẩm Microsoft Store (ví dụ "9NBLGGH4R32N"). Để trống cho tới khi có trang Store thật:
# khi trống, nút "Kiểm tra cập nhật / Cập nhật" mở trang tải về của dự án. build.rs đọc giá trị này.
[package.metadata.lvhv]
ms-store-id = ""

# Workspace riêng: crate này kéo nhiều thư viện (Slint, winit, Skia). Giữ ngoài workspace gốc để
# `cargo test` của lõi không phải dựng giao diện. Xem docs/04-BUILD-NATIVE.md.
[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
