# XcodeGen — Lịch và Văn hóa Việt (iOS 16+, macOS 13+). Sinh dự án:  xcodegen generate
# Cần chạy ./build-xcframework.sh trước (tạo build/LvhvCore.xcframework và Generated/LvhvCore.swift).
name: LichVanHoaViet
options:
  bundleIdPrefix: vn.clevix
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: vi
# Phiên bản: KHÔNG ghi số ở đây. MARKETING_VERSION, CURRENT_PROJECT_VERSION, LVHV_BUILD_DATE và
# APP_STORE_ID đến từ Generated/Version.xcconfig do gen-version.sh sinh từ tệp VERSION ở gốc kho.
configFiles:
  Debug: Generated/Version.xcconfig
  Release: Generated/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(LVHV_TEAM_ID)"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
configs:
  Debug: debug
  Release: release
targets:
  LichViet-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Generated
      - path: iOS
        excludes: ["Info.plist"]
    dependencies:
      - framework: build/LvhvCore.xcframework
        embed: false
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: "Lịch và Văn hóa Việt"
        CFBundleName: "Lịch Việt"
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [LVHVSerif-Regular.ttf, LVHVSerif-SemiBold.ttf, LVHVSerif-Bold.ttf]
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LVHVBuildDate: "$(LVHV_BUILD_DATE)"
        LVHVAppStoreID: "$(APP_STORE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.clevix.lichviet
        PRODUCT_NAME: LichViet
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        SUPPORTS_MACCATALYST: NO
  LichViet-macOS:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Generated
      - path: macOS
        excludes: ["Info.plist", "LichViet.entitlements"]
    dependencies:
      - framework: build/LvhvCore.xcframework
        embed: false
    entitlements:
      path: macOS/LichViet.entitlements
      properties:
        # Hộp cát (App Sandbox), KHÔNG có com.apple.security.network.client/server.
        com.apple.security.app-sandbox: true
    info:
      path: macOS/Info.plist
      properties:
        CFBundleDisplayName: "Lịch và Văn hóa Việt"
        CFBundleName: "Lịch và Văn hóa Việt"
        CFBundleDevelopmentRegion: vi
        CFBundleLocalizations: [vi]
        LSApplicationCategoryType: public.app-category.reference
        ATSApplicationFontsPath: "."  # phông nằm thẳng trong Contents/Resources
        NSHumanReadableCopyright: "© 2026 Clevix LLC (Clevix Lab)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LVHVBuildDate: "$(LVHV_BUILD_DATE)"
        LVHVAppStoreID: "$(APP_STORE_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.clevix.lichviet
        PRODUCT_NAME: "Lịch và Văn hóa Việt"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
