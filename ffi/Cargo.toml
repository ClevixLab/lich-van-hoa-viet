[package]
name = "lvhv-ffi"
version = "0.1.0"
edition = "2021"
description = "Lớp FFI (UniFFI) của Lịch và Văn hóa Việt cho Android, iOS/macOS và Windows — Clevix Lab"
license = "MIT"
publish = false

[lib]
name = "lvhv_ffi"
# cdylib: Android (.so qua JNA) và kiểm tra bindgen trên Linux
# staticlib: iOS/macOS (XCFramework)
# lib: ứng dụng Windows (Rust thuần, gọi trực tiếp không qua FFI)
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen-cli"]

[features]
# Bật nhị phân uniffi-bindgen (chỉ dùng lúc sinh mã Kotlin/Swift, không vào ứng dụng).
bindgen-cli = ["uniffi/cli"]

[dependencies]
lvhv-core = { path = "../core" }
lvhv-memorial = { path = "../memorial" }
lvhv-store = { path = "../store" }
lvhv-backup = { path = "../backup" }
getrandom = { version = "=0.4.3" }
uniffi = { version = "=0.29.4" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

